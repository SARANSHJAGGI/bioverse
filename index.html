<style>

*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);display:flex;justify-content:center;align-items:center}
#app{width:100%;height:100%;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;position:relative}
@media(min-width:700px){body{background:#1b2742}#app{width:400px;height:min(820px,94vh);border-radius:38px;border:10px solid #05091a;box-shadow:0 20px 60px #0008}}
header{background:var(--nav);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;align-items:center;gap:8px}
header b{flex:1;font-size:18px}header button{background:#ffffff22;color:#fff;border:0;border-radius:10px;padding:7px 10px;font-size:13px}
main{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav a{flex:1;text-align:center;padding:8px 2px;font-size:11px;color:var(--mu);text-decoration:none}
nav a span{display:block;font-size:20px}nav a.on{color:var(--ac);font-weight:700}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,#0b1530,#1b2f6b 60%,#4b3bb5);color:#fff;border-radius:18px;padding:18px;margin-bottom:12px}
.hero h1{font-size:22px;margin:0 0 6px}.hero p{margin:0 0 10px;color:#cfdcff;font-size:14px}
h2{font-size:17px;margin:4px 0 10px}h3{font-size:15px;margin:12px 0 4px}p,li{line-height:1.5;font-size:14.5px}
.mu{color:var(--mu);font-size:12.5px}
button,.b{font:inherit;cursor:pointer}
.btn{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:12px;padding:10px 14px;font-weight:600;margin:3px 4px 3px 0;display:inline-block;text-decoration:none}
.btn.o{background:none;color:var(--ac);border:1.5px solid var(--ac)}
.chip{display:inline-block;padding:4px 10px;border-radius:99px;background:var(--bd);color:var(--tx);font-size:12px;margin:2px 4px 2px 0;border:0}
.chip.on{background:var(--ac);color:#fff}
input,select{width:100%;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin-bottom:8px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:12px;padding:11px;margin:6px 0}
.opt.ok{border-color:#16a34a;background:#16a34a22}.opt.no{border-color:#dc2626;background:#dc262622}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.gel{position:relative;height:210px;background:#12305a;border-radius:12px;display:flex;justify-content:space-around;padding:0 6px}
.lane{position:relative;width:15%;border-left:1px dashed #ffffff22}.lane em{position:absolute;top:-1px;left:10%;width:80%;height:8px;background:#06142b;border-radius:2px}
.lane u{position:absolute;left:12%;width:76%;height:6px;background:#7df9ff;border-radius:3px;top:14px;transition:top 3.5s ease-in-out;text-decoration:none}
.lane small{position:absolute;bottom:-18px;width:100%;text-align:center;color:var(--mu);font-size:10px}
.dna{display:flex;justify-content:center;gap:5px;margin:8px 0}.dna i{width:8px;height:44px;border-radius:5px;background:linear-gradient(var(--ac),var(--ac2));animation:w 2s ease-in-out infinite}
@keyframes w{50%{transform:scaleY(.35)}}@media(prefers-reduced-motion:reduce){.dna i{animation:none}.lane u{transition:none}}
.modal{position:absolute;inset:0;background:#000a;display:flex;align-items:flex-end;z-index:9}.modal .c{width:100%;margin:0;border-radius:22px 22px 0 0}
.msg{padding:9px 12px;border-radius:14px;margin:6px 0;max-width:88%;font-size:14px;line-height:1.45}.me{background:var(--ac);color:#fff;margin-left:auto}.ai{background:var(--card);border:1px solid var(--bd)}
@media print{header,nav,.btn{display:none}}

{id:"dna",cat:"Molecular Biology",lv:"Beginner",t:"DNA & RNA Structure",min:4,b:"DNA is a double helix of two antiparallel strands. Each strand is a chain of nucleotides (sugar, phosphate, base). A pairs with T, and G pairs with C, held by hydrogen bonds. RNA is usually single-stranded, uses ribose and replaces T with U.",k:"Nucleotide, base pairing, antiparallel, ribose",q:[["Which base pairs with guanine in DNA?",["Adenine","Cytosine","Thymine","Uracil"],1,"G–C pair with three hydrogen bonds."],["Which base is found in RNA but not DNA?",["Uracil","Thymine","Cytosine","Guanine"],0,"RNA uses uracil in place of thymine."]]},
{id:"rep",cat:"Molecular Biology",lv:"Intermediate",t:"DNA Replication",min:5,b:"Replication is semi-conservative: each new molecule has one old and one new strand. Helicase unwinds the helix, primase lays RNA primers, and DNA polymerase extends new DNA 5′→3′. The lagging strand is built as Okazaki fragments joined by ligase.",k:"Helicase, primase, polymerase, Okazaki fragment, ligase",q:[["Which enzyme joins Okazaki fragments?",["Helicase","Ligase","Primase","Gyrase"],1,"DNA ligase seals nicks between fragments."],["Replication is described as…",["Conservative","Dispersive","Semi-conservative","Random"],2,"Meitotic-free: each daughter has one parental strand (Meselson–Stahl)."]]},
{id:"tt",cat:"Molecular Biology",lv:"Intermediate",t:"Transcription & Translation",min:5,b:"Transcription: RNA polymerase copies a gene into mRNA. Translation: ribosomes read mRNA codons (three bases each); tRNA brings matching amino acids, building a protein. AUG is the usual start codon.",k:"mRNA, codon, tRNA, ribosome, start codon",q:[["How many bases form one codon?",["1","2","3","4"],2,"A codon is a triplet."],["Where does translation occur?",["Ribosome","Nucleolus","Golgi","Lysosome"],0,"Ribosomes assemble proteins."]]},
{id:"men",cat:"Genetics",lv:"Beginner",t:"Mendelian Inheritance",min:4,b:"Alleles are versions of a gene. A dominant allele shows in heterozygotes; a recessive one only when homozygous. A monohybrid cross Aa × Aa gives genotypes 1 AA : 2 Aa : 1 aa and a 3:1 dominant:recessive phenotype ratio. This is a simplified model; many traits are polygenic.",k:"Allele, genotype, phenotype, homozygous, heterozygous",q:[["Aa × Aa: probability of aa offspring?",["0","25%","50%","75%"],1,"1 in 4."],["Which genotype is heterozygous?",["AA","aa","Aa","None"],2,"Two different alleles."]]},

{id:"crispr",cat:"Biotech Techniques",lv:"Advanced",t:"CRISPR-Cas9 Basics",min:5,b:"CRISPR-Cas9 uses a guide RNA to direct the Cas9 nuclease to a matching DNA sequence next to a PAM motif, where it makes a double-strand break. The cell repairs it by NHEJ (often causing indels) or HDR (using a template). Off-target edits and ethics are active topics.",k:"Guide RNA, PAM, NHEJ, HDR",q:[["What directs Cas9 to its target?",["Guide RNA","Ligase","Primer","Ribosome"],0,"The gRNA pairs with target DNA."],["NHEJ often results in…",["Perfect repair","Indels","Replication","Translation"],1,"Error-prone repair."]]},
{id:"imm",cat:"Immunology",lv:"Beginner",t:"Vaccines & Immunity",min:4,b:"Vaccines expose the immune system to an antigen (not the disease) so B and T cells form memory. On real infection, memory cells respond faster and stronger. Antibodies are proteins that bind specific antigens.",k:"Antigen, antibody, memory cell",q:[["What do vaccines train?",["Immune memory","Bone growth","Digestion","Photosynthesis"],0,"They create memory cells."],["Antibodies bind…",["Antigens","Lipids","Starch","Primers"],0,"Each is specific to an antigen."]]}];
